<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D6 hero textures</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>html,body{margin:0;background:#000;color:#fff;font:11px/1.3 "IBM Plex Mono",monospace;overflow:hidden}
#host{position:fixed;inset:0}.lb{position:absolute;transform:translate(-50%,0);white-space:nowrap;text-transform:uppercase;letter-spacing:.08em;color:#b9b9b9}
.lb.ok{color:#97ddfb}#st{position:fixed;left:10px;top:8px}</style></head><body>
<div id="host"></div><div id="st"></div>
<script type="module">
// ?q=low for the low tier, ?flat to skip lights (env only)
import * as THREE from 'three';
import { loadHeroTextures, TEX_ROLES } from '../hero-tex.js';
const qs = new URLSearchParams(location.search), quality = qs.get('q') || 'high';
const host = document.getElementById('host'), st = document.getElementById('st');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
host.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x05070a);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100); cam.position.set(0, -0.2, 19);
if (!qs.has('flat')) {
  const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-3, 4, 5); scene.add(key);
  scene.add(new THREE.HemisphereLight(0x8aa0c0, 0x201810, 0.6));
}
const COLS = 4, cells = [];
TEX_ROLES.forEach((role, i) => {
  const x = (i % COLS - (COLS - 1) / 2) * 3.3, y = -(Math.floor(i / COLS) - 1.5) * 2.75 + 0.15;
  const g = new THREE.Group(); g.position.set(x, y, 0); scene.add(g);
  const base = { color: 0x808080, roughness: 0.8, metalness: 0 };
  if (role === 'glass_smudge') Object.assign(base, { color: 0x9aa4ae, roughness: 1, metalness: 1 });
  if (role === 'brushed_metal' || role === 'night_sky_hdr') Object.assign(base, { metalness: 1, roughness: role === 'night_sky_hdr' ? 0.05 : 1 });
  const pm = new THREE.MeshStandardMaterial(base), sm = new THREE.MeshStandardMaterial(base);
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(1.9, 1.9), pm); plane.position.x = -0.55; plane.rotation.x = -0.45; g.add(plane);
  const sph = new THREE.Mesh(new THREE.SphereGeometry(0.62, 48, 32), sm); sph.position.set(0.85, -0.05, 0.4); g.add(sph);
  if (role === 'tyre_track_decal') { // decal over a dirt-coloured ground plane
    pm.color.set(0x6b5640); const d = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 1.9), new THREE.MeshStandardMaterial({ transparent: true, depthWrite: false, roughness: 0.8, color: 0xffffff, opacity: 0 }));
    d.position.z = 0.002; plane.add(d); cells.push({ role, decal: d.material, g });
  } else cells.push({ role, pm, sm, g });
  const lb = document.createElement('div'); lb.className = 'lb'; lb.textContent = role; document.body.appendChild(lb); cells[cells.length - 1].lb = lb;
});
function placeLabels() {
  for (const c of cells) { const v = c.g.position.clone(); v.y -= 1.12; v.project(cam);
    Object.assign(c.lb.style, { left: (v.x * .5 + .5) * innerWidth + 'px', top: (-v.y * .5 + .5) * innerHeight + 'px' }); }
}
const tex = loadHeroTextures({ THREE, renderer, quality });
window.TEX = tex;
const t0 = performance.now(), landed = [];
function applyRole(role, set) {
  const c = cells.find(c => c.role === role); if (!c) return;
  landed.push(role + ' ' + Math.round(performance.now() - t0) + 'ms'); c.lb.classList.add('ok');
  if (role === 'night_sky_hdr') { scene.environment = set.envMap || null; scene.background = set.map; scene.backgroundIntensity = 0.35 * set.intensity;
    scene.environmentIntensity = set.intensity; for (const m of [c.pm, c.sm]) m.color.set(0xffffff); return; }
  if (c.decal) { Object.assign(c.decal, { map: set.map, normalMap: set.normalMap || null, opacity: 1 }); c.decal.needsUpdate = true; return; }
  const s = Array.isArray(set.texScale) ? set.texScale : [set.texScale, set.texScale];
  for (const [m, rep] of [[c.pm, 2], [c.sm, 1.5]]) {
    for (const k of ['map', 'normalMap', 'roughnessMap', 'aoMap', 'metalnessMap']) {
      if (!set[k]) continue;
      const t = set[k].clone(); t.repeat.set(rep, rep * s[1] / s[0]); m[k] = t;  // clone shares the uploaded image
    }
    if (set.map) m.color.set(0xffffff);
    if (set.roughnessMap) m.roughness = 1;
    if (set.metalnessMap) m.metalness = 1;
    m.needsUpdate = true;
  }
}
tex.onReady(applyRole);
tex.ready.then(r => { window.TEX_RESULT = r; window.LANDED = landed; window.DONE = true;
  st.textContent = `${quality}: ${r.loaded.length} loaded, failed: ${r.failed.join(', ') || 'none'} | ${Math.round(performance.now() - t0)} ms`; });
function frame() { placeLabels(); renderer.render(scene, cam); requestAnimationFrame(frame); }
window.renderOnce = () => { placeLabels(); renderer.render(scene, cam); };
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
frame();
</script></body></html>
